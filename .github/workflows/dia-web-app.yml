name: Dia+ checks
on:
  push:
    paths:
      - "dia-web-app/**"
      - ".github/workflows/dia-web-app.yml"
  pull_request:
    paths:
      - "dia-web-app/**"
      - ".github/workflows/dia-web-app.yml"
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dia-web-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run check
      - run: npm test
