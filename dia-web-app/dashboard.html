<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#06261C">
  <meta name="description" content="Your Dia account and order dashboard.">
  <title>Dia · My account</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <script src="/dashboard.js" defer></script>
</head>
<body>
  <main class="dashboard-shell">
    <header class="dashboard-header">
      <a class="brand" href="/">Dia<span class="brand-mark">✳</span></a>
      <div class="dashboard-actions">
        <a class="dashboard-button" href="/">Back to Dia</a>
        <button id="dashboardSignOut" class="dashboard-button primary" type="button">Sign out ↗</button>
      </div>
    </header>
    <section class="dashboard-content">
      <div class="dashboard-hero">
        <div><p class="eyebrow">YOUR DIA ACCOUNT</p><h1>Good to see you,<br><em id="customerName">there.</em></h1></div>
        <p>Your private space for account details and order history. Your account is protected by your Dia sign-in session.</p>
      </div>
      <div id="dashboardNotice" class="auth-notice" role="status" aria-live="polite" hidden></div>
      <div class="dashboard-stats">
        <article class="dashboard-stat"><span>Account status</span><strong id="accountStatus">—</strong></article>
        <article class="dashboard-stat"><span>Your role</span><strong id="accountRole">—</strong></article>
        <article class="dashboard-stat"><span>Total orders</span><strong id="orderCount">—</strong></article>
      </div>
      <section class="dashboard-panel" aria-labelledby="ordersHeading">
        <div class="dashboard-panel-head"><h2 id="ordersHeading">Your orders</h2><a class="dashboard-button" href="/">Explore Dia</a></div>
        <div id="orderList" aria-live="polite"><p class="dashboard-empty">Loading your order history…</p></div>
      </section>
    </section>
  </main>
</body>
</html>
